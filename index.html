<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이율리 | 청각장애아교육 박사 · 초등교사</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.com/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #2D312E;
            --text-muted: #666C67;
            --accent-warm: #8C6D58;
            --accent-olive: #5C6B57;
            --accent-light: #F2ECE4;
            --border-color: #E8E2D9;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            word-break: keep-all;
        }

        h1, h2, h3, .poetic-font { font-family: 'Gowun Batang', serif; }

        .navbar {
            background-color: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .hero-section {
            min-height: 85vh;
            display: flex;
            align-items: center;
            padding-top: 5rem;
            padding-bottom: 3rem;
        }

        .profile-img-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background-color: var(--accent-light);
            border: 3px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .poetic-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .poetic-subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        section {
            padding: 5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            color: var(--text-main);
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-warm);
            opacity: 0.5;
        }

        .card-custom {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            height: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }

        .timeline-item {
            position: relative;
            padding-left: 1.8rem;
            margin-bottom: 1.5rem;
            border-left: 2px solid var(--accent-light);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-warm);
        }

        .timeline-date {
            font-size: 0.9rem;
            color: var(--accent-olive);
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            background-color: var(--accent-light);
            color: var(--accent-warm);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-right: 0.4rem;
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top navbar-light">
        <div class="container">
            <a class="navbar-brand poetic-font fw-bold" href="#">이율리</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="#experience">경력</a></li>
                    <li class="nav-item"><a class="nav-link" href="#research">연구 · 교재</a></li>
                    <li class="nav-item"><a class="nav-link" href="#sign-media">수어 교육 유튜브</a></li>
                    <li class="nav-item"><a class="nav-link" href="#hula">훌라</a></li>
                    <li class="nav-item"><a class="nav-link" href="#interests">관심사</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">문의</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="hero-section text-center container">
        <div class="row justify-content-center w-100">
            <div class="col-lg-9">
                <div class="profile-img-container">
                    <i class="bi bi-person text-muted display-4"></i>
                </div>
                <h1 class="poetic-title">
                    "침묵을 넘어 손짓의 언어로,<br class="d-none d-md-inline"> 세상을 그리는 몸짓의 자유로."
